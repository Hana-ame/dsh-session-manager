# The `session-manager` agent preset: a coordination-focused agent.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The host
# composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model route.
#
# What this preset deliberately does NOT compose, compared with `standard`:
# no shell (`tool-bash` / `tool-pwsh`), no background-job controls, no skills,
# no plan mode, no presentation tool, and no delegation/workflow rows. The
# agent this produces cannot run commands; besides observing and directing
# OTHER sessions through the tools registered by the `dsh-session-manager`
# package (see the `tool-session-control` row), it holds its own filesystem
# read/write tools (the filesystem rows below), so the persona's "read
# ~/knowledge-base/INDEX.md first" is something the agent can do itself rather
# than delegating.
#
# Web access is not a row here: `tool-web` is re-enabled on the HOST plane by
# the home patch ($DSH_HOME/cordis.patch.yml), so every session has it no
# matter which preset it names.
#
# The tools row names the PACKAGE, not a file in this directory, so the package
# stays the single source of truth for both of its layers: the durable records
# (lib/store.mjs) and the tools (lib/tools.mjs). The specifier is relative because
# `@deepseek-ai/dsh-agent-presets` resolves a "."-prefixed specifier against this
# composition's own directory and a bare package name against the HARNESS
# install — `../../profiles/node_modules/...` is the one form that reaches the
# installed package. Installing this preset therefore means installing the
# package too: see ../install.sh.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# The one such group below is `compaction`. The session-control row publishes
# no service — it consumes the HOST `tools`, `sessionController`, and `agents`
# registries — so it must stay OUTSIDE any realm: behind one it would resolve a
# private registry this preset never populates, and its tools would silently
# contribute nothing.

# ── identity ────────────────────────────────────────────────────────────────

# The coordinator persona IS this preset's product. The injected text is a
# one-line pointer: the discipline itself (MUST / MUST NOT / SHOULD, tool and
# scenario tables) lives in the knowledge-base node that INDEX.md registers, so
# this composition carries no protocol text to keep in sync. `{{cwd}}` resolves
# from the agent's own workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是会话管理角色，请先读~/knowledge-base/INDEX.md（读取纪律与维护提示见 ~/knowledge-base/README.md）
    suffix: 你自己的会话工作目录是 {{cwd}}。

# ── session management ──────────────────────────────────────────────────────

# A relative specifier resolves against THIS composition's own directory, so the
# plugin travels with the preset and needs no package install. It imports no
# packages — only `node:*` builtins, which resolve anywhere — and registers six
# tools; see the file's own header for why.
- id: tool-session-control
  name: '../../profiles/node_modules/dsh-session-manager/lib/tools.mjs'

# `/loop` — human slash command plus a fixed-rate (default 120 s) per-session
# inspection timer, implemented by the sibling package module `lib/loop.mjs`.
# It registers the command into the HOST `commands` registry and consumes the
# host `sessionController` / `agents` / `timer` services through `ctx.get`,
# and publishes no service of its own — so, exactly like `tool-session-control`,
# this row must stay OUTSIDE any `isolate` realm (behind one it would resolve a
# private registry this preset never populates, and `/loop` would do nothing).
- id: tool-loop
  name: '../../profiles/node_modules/dsh-session-manager/lib/loop.mjs'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both rows register into the host `tools` registry and provide nothing, so they
# need no realm; the `fs` service and its policy stay in the host composition.
# `tool-fs` supplies read / write / edit / read_image, `tool-fs-search` supplies
# glob / grep — together, opening, searching, listing and editing files.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── coordination supporting rows ────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# The TODO list is how one coordinator tracks several sessions at once. Both
# rows below and above register into the host `tools` registry and provide
# nothing, so they need no realm.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The goal service and its session driver stay on the host plane, where the
# Gateway can resolve them. The human command and the model-facing tool
# register into THIS preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no
# configuration, keys every fold by Session, and owns the context-meter
# projection units the browser reads for every session — behind a realm those
# units would come and go with whichever presets happen to be mounted. What a
# preset chooses is whether its agent compacts at all, which is
# `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
