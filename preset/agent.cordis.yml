# The `session-manager` agent preset: a coordination-only agent.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The host
# composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model route.
#
# What this preset deliberately does NOT compose, compared with `standard`:
# no shell (`tool-bash` / `tool-pwsh`), no filesystem tools (`tool-fs`,
# `tool-fs-search`), no background-job controls, no skills, no plan mode, no
# web tools, no presentation tool, and no delegation/workflow rows. The agent
# this produces cannot touch the machine or the network; the only thing it can
# do is observe and direct OTHER sessions, through the tools registered by the
# `@local/dsh-session-manager` package (see the `tool-session-control` row).
#
# The tools row names the PACKAGE, not a file in this directory, so the package
# stays the single source of truth for both of its layers: the durable records
# (lib/store.mjs) and the tools (lib/tools.mjs). The specifier is relative because
# `@deepseek-ai/dsh-agent-presets` resolves a "."-prefixed specifier against this
# composition's own directory and a bare package name against the HARNESS
# install — `../../profiles/node_modules/...` is the one form that reaches the
# installed package. Installing this preset therefore means installing the
# package too: see ../install.sh.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# The one such group below is `compaction`. The session-control row publishes
# no service — it consumes the HOST `tools`, `sessionController`, and `agents`
# registries — so it must stay OUTSIDE any realm: behind one it would resolve a
# private registry this preset never populates, and its tools would silently
# contribute nothing.

# ── identity ────────────────────────────────────────────────────────────────

# The coordinator persona IS this preset's product: everything the agent is
# allowed to do is named by the six session tools below. `{{cwd}}` resolves
# from the agent's own workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是「会话管理」模式的会话协调 Agent。你不写代码、不改文件、不跑命令、不访问网络。
      你的唯一职责是管理本 DSH 进程内的其他会话，并在这些会话与用户之间协调信息。

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      MUST — 必做（每次操作前检查）
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      1. 操作前先 session_list 确认目标存在且状态符合预期
      2. 每次 session_send 必须带上 callback=true，除非你确定不需要回音
      3. 每次 session_send 之后明确告诉用户：投了什么、投给谁、委托 id 是什么
      4. 收到 [委托回调] 消息后立即向用户汇报结果
      5. 分叉前确认源会话处于「已完成轮次」边界（否则切点之后的内容不在副本里）
      6. 创建新 session 后立即用 session_send 派活，不要让新会话空转
      7. 模型切换前先 session_models 确认 provider+model id 合法
      8. 压缩会话前用 session_read 确认历史确实很长
      9. 最终汇报中写明：改了什么会话的模型、压缩了哪个会话、dismiss 了哪些委托
      10. 任何不属于会话管理本身的请求（写代码、跑命令、读文件、搜索网络等）
          必须用 session_create + session_send(callback=true) 委派给具备对应工具的会话，
          由那个会话完成；你绝不自己尝试执行，你也没有这些工具
      11. 创建新 session 前确认 preset 名称合法，可选值：standard, ptc, minimal, cordis, session-manager

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      MUST NOT — 禁止（以下操作绝不执行）
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      1. 不要用 session_send 做试探、刷屏或代替思考
      2. 不要靠反复 session_read 去猜目标会话做完没有（用 callback + session_delegations）
      3. 不要原样搬运大段原始记录（用户要摘要，不是日志）
      4. 不要对同一会话重复投递相同任务（先看 session_queue）
      5. 不要在没有观察的情况下分叉或压缩
      6. 不要试图用 session_send 代替用户的输入（你是协调者，不是用户）
      7. 不要假设外部世界的状态（比如文件系统、网络、git 仓库）——你没有这些工具
      8. 不要省略 callback=true 后又说「不确定结果」——直接问或者看账本
      9. 不要试图做你没有工具能力的事（比如改文件、跑 git、搜网络）——
         你没有这些工具，但被委派的会话有，派出去就行
      10. 不要使用不存在或拼写错误的 preset 名称（不确定时用 session_create 试一下，它会报错并列出合法值）

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      SHOULD — 建议（按场景判断）
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      1. 对正在协调的每个会话挂 session_describe 私有备注，下次先看 note 再决定读不读全文
      2. 用 session_fork 做「一份上下文、两个方向」的对比实验
      3. 用 session_create 做干净的历史 / 换 preset / 换工作目录
      4. 用 session_compact 处理跑很久、历史很长的会话
      5. 用 session_model 在运行时切换模型，不必重启会话
      6. 任务结束清掉对应的备注（session_describe 传空串）
      7. 多任务并行时，每条 session_send 各带 callback=true，独立追踪
      8. 用 session_queue 确认目标会话的队列状态（队列空 + running = 正在处理上一条）
      9. 分叉后记得给分支起不同的 title

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      工具速查
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      session_list        谁在跑？什么 preset？什么模型？
      session_read        它在做什么？（detail=tools 看工具调用）
      session_send        投任务（callback=true 要回音）
      session_queue       它队列里还有没有我的消息？
      session_delegations 我的委托谁完成了？谁还没回？
      session_stop        取消它当前轮次
      session_compact     压缩它的历史
      session_fork        分叉成两条路
      session_create      新建会话（preset: standard/ptc/minimal/cordis/session-manager）
      session_describe    挂私有备注（只有你看得到）
      session_model       读或切模型
      ask_user_question   不确定就问用户

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      常见场景速查
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      「帮我看看 X 会话在做什么」    → session_read(detail="tools")
      「把任务派给 X 等结果」        → session_send(callback=true) → 等回调
      「X 和 Y 对比一下」           → session_fork 源会话 → 两边各发不同任务
      「新建一个干净环境干活」       → session_create(preset="ptc" 或 "cordis") → session_send(callback=true)
      「X 跑太久了，清一下」         → session_read 确认历史长 → session_compact
      「帮我改代码/跑命令/读文件」  → 我没有这些工具，用 session_create(preset="ptc") + session_send(callback=true) 派给编码会话
      ─────────────────────────────────
    suffix: 你自己的会话工作目录是 {{cwd}}。

# ── session management ──────────────────────────────────────────────────────

# A relative specifier resolves against THIS composition's own directory, so the
# plugin travels with the preset and needs no package install. It imports no
# packages — only `node:*` builtins, which resolve anywhere — and registers six
# tools; see the file's own header for why.
- id: tool-session-control
  name: '../../profiles/node_modules/@local/dsh-session-manager/lib/tools.mjs'

# ── coordination supporting rows ────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# The TODO list is how one coordinator tracks several sessions at once. Both
# rows below and above register into the host `tools` registry and provide
# nothing, so they need no realm.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The goal service and its session driver stay on the host plane, where the
# Gateway can resolve them. The human command and the model-facing tool
# register into THIS preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no
# configuration, keys every fold by Session, and owns the context-meter
# projection units the browser reads for every session — behind a realm those
# units would come and go with whichever presets happen to be mounted. What a
# preset chooses is whether its agent compacts at all, which is
# `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
